<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <title>Signup</title>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <!--Nav Bar-->
    <nav class="bg-blue-600 p-4 text-white flex justify-between">
        <div>
            <h1 class="font-bold text-3xl">AI Blog Generator</h1>
        </div>
        <div>
            <a href="/" class="hover:underline text-white">Login</a>
            <a href="/" class="hover:underline text-white">Signup</a>
        </div>
    </nav>

    <br>
    <!--Main Content-->
    <div class="flex items-center justify-center h-screen">
        <div class="bg-white p-8 shadow-md rounded-lg  w-full">

            <!--Login form-->
            <form class="space-y-4">
                <h2 class="text-xl font-semibold">Signup</h2>
                <div>
                    <label for="username" class="block mb-1 font-medium">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your Username" class="w-full p-2 border rounded">
                </div>

                <div>
                    <label for="email" class="block mb-1 font-medium">Email</label>
                    <input type="text" placeholder="Enter your email" id="email" name="email" class="border rounded p-2 w-full">
                </div>

                <div>
                    <label for="password" class="font-medium block mb-1">Password</label>
                    <input type="text" id="password" name="password" placeholder="Enter your password" class="w-full p-2 border rounded">
                </div>

                <div>
                    <label for="repeatPassword" class="font-medium block mb-1">Repeat Password</label>
                    <input type="text" id="repeatPassword" name="repeatPassword" placeholder="Repeat your password" class="w-full p-2 border rounded">
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Signup</button>
            </form>

        </div>
    </div>
    
</body>
</html>
